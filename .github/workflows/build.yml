name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            ccache \
            clang-format-18 \
            clang-tidy-18 \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libcurl4-openssl-dev \
            libjack-jackd2-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-build-ccache

      - name: Fetch JUCE
        run: |
          if [ ! -d "libs/JUCE" ]; then
            git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git libs/JUCE
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Check clang-format
        run: |
          clang-format-18 --version
          clang-format-18 --dry-run --Werror src/

      - name: Check clang-tidy
        run: |
          clang-tidy-18 --version
          clang-tidy-18 -p build src/**/*.cpp --quiet

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlorpDrums-${{ matrix.os }}
          path: |
            build/GlorpDrums_artefacts/Release/VST3/GlorpDrums.vst3
            build/GlorpDrums_artefacts/Release/LV2/GlorpDrums.lv2
            build/GlorpDrums_artefacts/Release/Standalone/GlorpDrums
            build/GlorpKitEditor_artefacts/Release/GlorpKitEditor
          if-no-files-found: warn
