name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libfreetype-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libcurl4-openssl-dev \
            libjack-jackd2-dev

      - name: Fetch JUCE
        run: |
          if [ ! -d "libs/JUCE" ]; then
            git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git libs/JUCE
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlorpDrums-${{ matrix.os }}
          path: |
            build/GlorpDrums_artefacts/Release/VST3/GlorpDrums.vst3
            build/GlorpDrums_artefacts/Release/LV2/GlorpDrums.lv2
            build/GlorpDrums_artefacts/Release/Standalone/GlorpDrums
          if-no-files-found: warn
