name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            ccache \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libcurl4-openssl-dev \
            libjack-jackd2-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-release-ccache

      - name: Fetch JUCE
        run: |
          if [ ! -d "libs/JUCE" ]; then
            git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git libs/JUCE
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          # Bundle default demo kit into release package structure
          mkdir -p build/GlorpDrums_artefacts/Release/kits
          cp -r test/kits/GlorpDemoKit build/GlorpDrums_artefacts/Release/kits/

          # Also package standalone demo kit archive
          tar czf build/GlorpDrums_artefacts/Release/GlorpDemoKit.tar.gz -C test/kits GlorpDemoKit

          cd build/GlorpDrums_artefacts/Release
          tar czf GlorpDrums-${{ matrix.os }}.tar.gz \
            VST3/GlorpDrums.vst3 \
            LV2/GlorpDrums.lv2 \
            Standalone/GlorpDrums \
            kits/GlorpDemoKit

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            build/GlorpDrums_artefacts/Release/GlorpDrums-${{ matrix.os }}.tar.gz
            build/GlorpDrums_artefacts/Release/GlorpDemoKit.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
